[project]
name = "packing"
version = "0.1.0"
description = "Does LLM judge accuracy degrade as you pack more criteria into one call?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "datasets>=2.19",
    "openai>=1.40",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
bayes = ["bambi>=0.13", "arviz>=0.18"]

[project.scripts]
packing = "packing.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.2"]
